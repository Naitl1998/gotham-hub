<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр меню — The Cloud Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0e; --bg2:#141318; --card:#1a1916; --card2:#201e1a;
    --line:#2b2925; --gold:#f0a92a; --gold-dim:#7a5e25;
    --txt:#eceae4; --muted:#928e85; --green:#4caf6a; --red:#e0584f;
    --pork:#e98aa0; --beef:#c98b5a; --chicken:#e7c14a; --nuts:#b07b3e;
    --sea:#e8956a; --fish:#5aa9c9; --vegan:#6fc06a; --duck:#c47a4e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    font-size:16px;line-height:1.45;padding-bottom:90px;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;letter-spacing:.5px;margin:0}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}

  /* header */
  header{
    position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0c0c0e 70%,rgba(12,12,14,0));
    padding:14px 0 10px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{font-family:'Oswald';font-weight:700;font-size:26px;color:var(--gold);text-transform:uppercase;line-height:.9}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
  .tabs{display:flex;gap:8px;margin-top:12px}
  .tab{
    flex:1;text-align:center;padding:11px 6px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;
    font-family:'Oswald';letter-spacing:.5px;text-transform:uppercase;transition:.15s;
  }
  .tab.active{background:var(--gold);color:#1a1407;border-color:var(--gold)}

  /* study */
  .legend{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
  .legrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .legttl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);width:100%;margin-bottom:1px}
  .legttl.warn{color:var(--gold)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    padding:4px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%}
  .d-pork{background:var(--pork)}.d-beef{background:var(--beef)}.d-chicken{background:var(--chicken)}
  .d-nuts{background:var(--nuts)}.d-sea{background:var(--sea)}.d-fish{background:var(--fish)}.d-vegan{background:var(--vegan)}.d-duck{background:var(--duck)}

  .catbar{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;-ms-overflow-style:none;scrollbar-width:none}
  .catbar::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);
    color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'Oswald';letter-spacing:.4px}
  .chip.active{background:#2c2820;color:var(--gold);border-color:var(--gold-dim)}

  .sechead{font-family:'Oswald';font-size:22px;color:var(--gold);text-transform:uppercase;
    margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
  .sechead .cnt{font-size:13px;color:var(--muted);font-family:'Inter'}

  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
  .item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .item .nm{font-weight:600;font-size:15.5px;line-height:1.25}
  .item .en{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .item .price{font-family:'Oswald';color:var(--gold);font-size:18px;white-space:nowrap}
  .item .usd{font-size:11px;color:var(--muted);font-family:'Inter'}
  .item .ing{font-size:13px;color:#b9b5ac;margin-top:7px;line-height:1.4}
  .item .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;
    background:var(--card2);border:1px solid var(--line)}
  .tag-al{border-color:var(--gold);color:#f3cd84}
  .tag-ok{border-color:#2f5b3a;color:#7fc790;background:rgba(76,175,106,.08)}
  .meta{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}

  /* quiz */
  .quizcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:8px}
  .scorebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--muted)}
  .scorebar b{color:var(--gold);font-family:'Oswald';font-size:17px}
  .progress{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .progress > div{height:100%;background:var(--gold);width:0;transition:.3s}
  .qtype{font-size:12px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px;font-family:'Oswald'}
  .qtext{font-size:19px;font-weight:600;line-height:1.3;margin-bottom:16px}
  .qtext .hl{color:var(--gold)}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{padding:13px 14px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);
    cursor:pointer;font-size:15px;font-weight:500;transition:.12s;display:flex;align-items:center;gap:10px}
  .opt:active{transform:scale(.99)}
  .opt .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
  .opt.sel{border-color:var(--gold)}
  .opt.sel .box{background:var(--gold);border-color:var(--gold);color:#1a1407}
  .opt.correct{border-color:var(--green);background:rgba(76,175,106,.12)}
  .opt.wrong{border-color:var(--red);background:rgba(224,88,79,.12)}
  .opt.correct .box{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong .box{background:var(--red);border-color:var(--red);color:#fff}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Oswald';font-size:16px;font-weight:600;
    letter-spacing:.5px;text-transform:uppercase;cursor:pointer;margin-top:16px;transition:.15s}
  .btn.gold{background:var(--gold);color:#1a1407}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn:disabled{opacity:.4}
  .feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;display:none}
  .feedback.ok{background:rgba(76,175,106,.1);border:1px solid var(--green);display:block}
  .feedback.no{background:rgba(224,88,79,.1);border:1px solid var(--red);display:block}
  .feedback b{color:var(--gold)}
  .listinput{flex:1;padding:12px 13px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);color:var(--txt);font-size:15px;font-family:'Inter'}
  .listinput:focus{outline:none;border-color:var(--gold)}
  .addbtn{width:52px;border-radius:11px;border:none;background:var(--gold);color:#1a1407;font-size:24px;font-weight:700;cursor:pointer}
  .listhint{font-size:13px;min-height:18px;margin-bottom:8px;color:var(--muted)}
  .listhint.good{color:var(--green)} .listhint.bad{color:var(--red)} .listhint.dup{color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .chipok{font-size:13px;font-weight:600;padding:6px 11px;border-radius:20px;background:rgba(76,175,106,.14);border:1px solid var(--green);color:#cfeed8}
  .counter{font-size:14px;margin:4px 0 2px}.counter b{color:var(--gold);font-family:'Oswald';font-size:18px}

  .setup{margin-top:8px}
  .setup h2{font-size:24px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
  .setup p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .modegrid{display:flex;flex-direction:column;gap:9px}
  .modebtn{text-align:left;padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer}
  .modebtn .t{font-weight:700;font-size:16px;font-family:'Oswald';letter-spacing:.4px}
  .modebtn .d{font-size:13px;color:var(--muted);margin-top:3px}
  .modebtn.on{border-color:var(--gold);background:#211d15}

  .results{text-align:center;padding:24px 10px}
  .results .big{font-family:'Oswald';font-size:64px;color:var(--gold);line-height:1}
  .results .lbl{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .results .verdict{font-size:17px;font-weight:600;margin-bottom:20px}

  .note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;margin:14px 0;line-height:1.5}
  .note b{color:var(--gold)}
</style>
</head>

/* ============ STUDY UI ============ */
function buildLegend(){
  const allerg=['nuts','sea'];
  const cats=['chicken','pork','beef','fish','duck','vegan'];
  const mk=k=>`<span class="pill"><span class="dot ${ADOT[k]}"></span>${A[k]}</span>`;
  document.getElementById('legend').innerHTML =
    `<div class="legrow"><span class="legttl warn">⚠️ Аллергены</span>${allerg.map(mk).join('')}</div>`+
    `<div class="legrow"><span class="legttl">Категории состава (не аллергены)</span>${cats.map(mk).join('')}</div>`;
}
let curCat = Object.keys(ALLCATS)[0];
function buildCatbar(){
  document.getElementById('catbar').innerHTML = Object.keys(ALLCATS).map(c=>
    `<div class="chip ${c===curCat?'active':''}" onclick="pickCat('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');
}
function pickCat(c){curCat=c;buildCatbar();renderMenu();window.scrollTo({top:0,behavior:'smooth'});}
function renderMenu(){
  const items = ALLCATS[curCat];
  let html='', lastSub=null;
  items.forEach(it=>{
    if(it._sub && it._sub!==lastSub){html+=`<div class="sechead">${it._sub}</div>`;lastSub=it._sub;}
    const baseTag = it.base?`<span class="tag" style="color:var(--gold)">🍸 ${it.base}</span>`:'';
    let allergTags='';
    if(Array.isArray(it.al)){
      const aller = it.al.filter(a=>a==='nuts'||a==='sea');
      const cats  = it.al.filter(a=>a!=='nuts'&&a!=='sea');
      if(aller.length) allergTags += aller.map(a=>`<span class="tag tag-al"><span class="dot ${ADOT[a]}"></span>${A[a].replace(/^[^ ]+ /,'')}</span>`).join('');
      else allergTags += `<span class="tag tag-ok">✅ без аллергенов</span>`;
      allergTags += cats.map(a=>`<span class="tag"><span class="dot ${ADOT[a]}"></span>${A[a].replace(/^[^ ]+ /,'')}</span>`).join('');
    }
    const priceStr = (it.p==null)
      ? `<div class="price" style="color:var(--muted);font-size:14px">уточни</div>`
      : `<div class="price">${it.p}K</div><div class="usd">~${it.u}</div>`;
    html+=`<div class="item"><div class="top">
      <div><div class="nm">${it.nm}</div>${it.en?`<div class="en">${it.en}</div>`:''}</div>
      <div style="text-align:right">${priceStr}</div>
    </div>
    ${it.ing?`<div class="ing">${it.ing}</div>`:''}
    ${(allergTags||baseTag)?`<div class="tags">${baseTag}${allergTags}</div>`:''}</div>`;
  });
  document.getElementById('menuList').innerHTML = html;
}

function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,n)}

/* генераторы вопросов */
const TRUE_ALLERGENS=['nuts','sea'];
const CAT_LBL={pork:'свинина',beef:'говядина',chicken:'курица',fish:'рыба'};

function genAllergenWhich(){ // какие аллергены (орехи/морепродукты) в блюде
  const f = rand(FOODFLAT);
  const correct = f.al.filter(a=>TRUE_ALLERGENS.includes(a));
  const opts=[
    {t:A.nuts,ok:correct.includes('nuts')},
    {t:A.sea,ok:correct.includes('sea')},
    {t:'Нет аллергенов',ok:correct.length===0}
  ];
  return {type:'multi',label:'Аллергены',q:`Какие аллергены в «<span class="hl">${f.nm}</span>»? (орехи / морепродукты)`,
    opts,expl:`«${f.nm}»: ${correct.length?correct.map(c=>A[c]).join(', '):'нет аллергенов (орехов/морепродуктов)'}. Состав: ${f.ing||'—'}.`};
}
function genAllergenWhere(){ // в каком блюде есть орехи/морепродукты
  const key = rand(TRUE_ALLERGENS);
  const lbl = key==='nuts'?'орехи':'морепродукты';
  const ans = rand(FOODFLAT.filter(x=>x.al.includes(key)));
  const without = FOODFLAT.filter(x=>!x.al.includes(key));
  const opts = shuffle([ans, ...sample(without,3)]);
  return {type:'single',label:'Аллергены',q:`В каком блюде есть <span class="hl">${lbl}</span>?`,
    opts:opts.map(o=>({t:o.nm,ok:o===ans})),expl:`«${ans.nm}» — ${A[key]}. Состав: ${ans.ing||'—'}.`};
}
function genAllergenYesNo(){
  const f = rand(FOODFLAT);
  const key = rand(TRUE_ALLERGENS);

function genCockBase(){

    opts,expl:`${c.nm}: ${c.ing}.`};
}

}

  }
}

function norm(s){return (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function aliasHit(input,alias){
  const ni=norm(input), na=norm(alias);
  if(!ni||!na) return 0;
  if(ni===na) return 1000;                                         // точное совпадение — главный приоритет
  if(ni.includes(na)) return 100+na.length;                        // ввод содержит весь alias
  if(ni.length>=3 && na.includes(ni)) return 10+ni.length;         // ввод — часть более длинного alias
  const it=ni.split(' '), at=na.split(' ').filter(x=>x.length>=3);
  if(at.length){
    let okc=0;
    for(const a of at){ if(it.some(t=>t.length>=3 && lev(t,a)<=(a.length>=6?2:1))) okc++; }
    if(okc>=at.length) return na.length-0.5;                       // значимые слова с опечатками
  }
  if(ni.length>=3 && lev(ni,na)<=(na.length>=6?2:1)) return na.length-0.6;  // целиком с опечатками
  return 0;
}
function bestMatch(input,items){
  let best=-1,bestScore=0;
  items.forEach((it,idx)=>{ let sc=0; for(const al of it.aliases) sc=Math.max(sc,aliasHit(input,al)); if(sc>bestScore){bestScore=sc;best=idx;} });
  return bestScore>0?best:-1;
}

  const inp=document.getElementById('listIn');
  document.getElementById('addBtn').onclick=listAdd;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();listAdd();}});
  inp.focus(); updateListCounter();
}
function listAdd(){
  const s=quizQuestions[qIdx].set, inp=document.getElementById('listIn');
  const val=inp.value.trim(), hint=document.getElementById('listHint');
  if(!val) return;
  const idx=bestMatch(val,s.items);
  if(idx<0){ hint.textContent='✗ «'+val+'» — нет в этом списке'; hint.className='listhint bad'; }
  else if(listMatched.has(idx)){ hint.textContent='• «'+s.items[idx].label+'» уже названо'; hint.className='listhint dup'; }
  else { listMatched.add(idx); hint.textContent='✓ '+s.items[idx].label; hint.className='listhint good'; renderChips(); }
  inp.value=''; inp.focus(); updateListCounter();
}
function renderChips(){
  const s=quizQuestions[qIdx].set;
  document.getElementById('chips').innerHTML=[...listMatched].map(i=>`<span class="chipok">✓ ${s.items[i].label}</span>`).join('');
}
function updateListCounter(){
  const s=quizQuestions[qIdx].set, have=listMatched.size, need=s.min;
  const cnt=document.getElementById('listCount');
  if(cnt) cnt.innerHTML = have>=need ? `Набрано <b>${have}</b> — достаточно ✅` : `Набрано <b>${have}</b> из <b>${need}</b> · осталось ${need-have}`;
  if(have>=need && !answered){
    answered=true; score++;
    const fb=document.getElementById('fb');
    fb.className='feedback ok';
    fb.innerHTML=`✅ Зачёт! Можешь добавить ещё или идти дальше.<br>Все варианты (${s.items.length}): ${s.items.map(x=>x.label).join(', ')}.`;
    const ab=document.getElementById('actBtn'); ab.style.display='block'; ab.textContent=qIdx<9?'Дальше →':'Результат';
    document.getElementById('giveBtn').style.display='none';
  }
}
function listGiveUp(){
  const s=quizQuestions[qIdx].set; answered=true;
  const fb=document.getElementById('fb');
  fb.className='feedback no';
  fb.innerHTML=`Полный список (${s.items.length}): ${s.items.map(x=>x.label).join(', ')}.<br>Ты набрал ${listMatched.size} из ${s.min}.`;
  const ab=document.getElementById('actBtn'); ab.style.display='block'; ab.textContent=qIdx<9?'Дальше →':'Результат';
  document.getElementById('giveBtn').style.display='none';
}

function buildPool(){
  const gens={
    allergen:[genAllergenWhich,genAllergenWhere,genAllergenWhereNot,genAllergenYesNo],
    category:[genCatWhere,genCatYesNo,genFoodIng],
    cocktail:[genCockBase,genCockByBase,genCockIng],
    price:[genPrice,genPriceReverse,genShisha],
    list:[genList],
    all:[genAllergenWhich,genAllergenWhere,genAllergenWhereNot,genAllergenYesNo,
         genCatWhere,genCatYesNo,genFoodIng,
         genCockBase,genCockByBase,genCockIng,
         genPrice,genPriceReverse,genShisha,genList]
  };
  const set = gens[quizMode]||gens.all;
  const valid=q=>{ if(!q) return false; if(q.type==='list') return q.set&&q.set.items&&q.set.items.length>=q.set.min;
    return q.opts&&q.opts.length>=2&&q.opts.some(o=>o.ok); };
  const out=[], seen=new Set(); let guard=0;
  while(out.length<10 && guard<300){ guard++; let q; try{q=rand(set)()}catch(e){continue}
    if(!valid(q)||seen.has(q.q)) continue; seen.add(q.q); out.push(q); }
  let g2=0;
  while(out.length<10 && g2<100){ g2++; let q; try{q=rand(set)()}catch(e){continue} if(valid(q)) out.push(q); }
  while(out.length<10) out.push(genPrice());
  return out;
}

function startQuiz(){
  quizQuestions=buildPool(); qIdx=0; score=0; renderQuestion();
}
function renderQuestion(){
  answered=false; selected=[]; listMatched=new Set();
  const q=quizQuestions[qIdx];
  if(q.type==='list'){ renderList(q); return; }
  const multi = q.type==='multi';
  Q.innerHTML=`
   <div class="scorebar"><span>Вопрос ${qIdx+1} / 10</span><span>Очки: <b>${score}</b></span></div>
   <div class="progress"><div style="width:${(qIdx)/10*100}%"></div></div>
   <div class="quizcard">
     <div class="qtype">${q.label}${multi?' · выбери все':''}</div>
     <div class="qtext">${q.q}</div>
     <div class="opts" id="opts">
       ${q.opts.map((o,i)=>`<div class="opt" data-i="${i}" onclick="pick(${i},${multi})">
          ${multi?'<div class="box"></div>':''}<span>${o.t}</span></div>`).join('')}
     </div>
     <div class="feedback" id="fb"></div>
     <button class="btn gold" id="actBtn" onclick="${multi?'checkMulti()':''}" ${multi?'':'disabled'}>${multi?'Проверить':'Выбери ответ'}</button>
   </div>`;
}
function pick(i,multi){
  if(answered) return;
  if(multi){
    const el=document.querySelector(`.opt[data-i="${i}"]`);
    if(selected.includes(i)){selected=selected.filter(x=>x!==i);el.classList.remove('sel')}
    else{selected.push(i);el.classList.add('sel')}
  } else {
    selected=[i]; checkSingle(i);
  }
}
function checkSingle(i){
  answered=true;
  const q=quizQuestions[qIdx];
  let ok=q.opts[i].ok;
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.style.pointerEvents='none';
    if(q.opts[idx].ok) el.classList.add('correct');
    else if(idx===i) el.classList.add('wrong');
  });
  finish(ok,q);
}
function checkMulti(){
  if(answered) return;
  answered=true;
  const q=quizQuestions[qIdx];
  const correctIdx=q.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
  const ok = selected.length===correctIdx.length && selected.every(s=>correctIdx.includes(s));
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.style.pointerEvents='none';
    if(q.opts[idx].ok) el.classList.add('correct');
    else if(selected.includes(idx)) el.classList.add('wrong');
  });
  finish(ok,q);
}
function finish(ok,q){
  if(ok) score++;
  const fb=document.getElementById('fb');
  fb.className='feedback '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ Верно! ':'❌ Не совсем. ')+'<br>'+q.expl;
  const btn=document.getElementById('actBtn');
  btn.disabled=false; btn.textContent = qIdx<9?'Дальше →':'Результат';
  btn.onclick=next;
}
function next(){
  qIdx++;
  if(qIdx>=10) showResults();
  else renderQuestion();
}
function showResults(){
  const pct=score*10;
  let verdict, emoji;
  if(score>=9){verdict='Отлично — готов к аттестации!';emoji='🔥'}
  else if(score>=7){verdict='Хорошо, но повтори слабые места.';emoji='👍'}
  else if(score>=5){verdict='Средне. Прогонь ещё пару раз.';emoji='📚'}
  else {verdict='Нужно ещё поучить меню.';emoji='💪'}
  Q.innerHTML=`<div class="results">
     <div style="font-size:40px">${emoji}</div>
     <div class="big">${score}/10</div>
     <div class="lbl">${pct}% правильных</div>
     <div class="verdict">${verdict}</div>
     <button class="btn gold" onclick="startQuiz()">Ещё раз</button>
     <button class="btn ghost" onclick="showQuizSetup()" style="margin-top:9px">Сменить режим</button>
   </div>`;
}

/* init */
buildLegend(); buildCatbar(); renderMenu();
</script>
