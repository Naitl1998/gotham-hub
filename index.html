<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gotham3032</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg,#0d1117);color:var(--text,#e6edf3);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;-webkit-tap-highlight-color:transparent}
.logo{font-size:28px;font-weight:700;background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;animation:fadeDown .5s ease}
.subtitle{color:var(--hint,#8b949e);margin-top:4px;font-size:13px;text-align:center;animation:fadeDown .5s ease}
.cards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:400px;margin:20px 0}
.card{position:relative;border-radius:16px;padding:20px;background:var(--card-bg,#161b22);cursor:pointer;transition:transform .2s,box-shadow .3s;animation:fadeUp .5s ease both;overflow:hidden;display:flex;align-items:center;gap:16px}
.card:nth-child(2){animation-delay:.1s}
.card::before{content:'';position:absolute;inset:0;border-radius:16px;padding:1.5px;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask-composite:xor;pointer-events:none}
.card.analysis::before{background:linear-gradient(135deg,#58a6ff,#bc8cff)}
.card.team::before{background:linear-gradient(135deg,#3fb950,#58d5c5)}
.card:active{transform:scale(.97)}
.card-icon{font-size:36px;flex-shrink:0}
.card-info{flex:1}
.card-title{font-size:18px;font-weight:700}
.card.analysis .card-title{color:#58a6ff}
.card.team .card-title{color:#3fb950}
.card-desc{color:var(--hint,#8b949e);font-size:13px;margin-top:2px}
.card-arrow{color:var(--hint,#8b949e);font-size:20px;flex-shrink:0}
.footer{color:var(--hint,#8b949e);font-size:11px;opacity:.4;animation:fadeUp .5s ease .2s both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="logo">⚡ Gotham3032</div>
<div class="subtitle">Выбери раздел</div>
<div class="cards">
  <div class="card analysis" onclick="go('analyzer.html')">
    <div class="card-icon">📊</div>
    <div class="card-info">
      <div class="card-title">Анализ</div>
      <div class="card-desc">Крипто-анализ BTC & ETH</div>
    </div>
    <div class="card-arrow">›</div>
  </div>
  <div class="card team" onclick="go('team.html')">
    <div class="card-icon">👥</div>
    <div class="card-info">
      <div class="card-title">Команда</div>
      <div class="card-desc">Наши агенты за работой</div>
    </div>
    <div class="card-arrow">›</div>
  </div>
</div>
<div class="footer">v1.0</div>
<script>
try{
  const tg=window.Telegram&&Telegram.WebApp;
  if(tg){tg.ready();tg.expand();
    const tp=tg.themeParams;
    if(tp){const s=document.documentElement.style;
      if(tp.bg_color)s.setProperty('--bg',tp.bg_color);
      if(tp.text_color)s.setProperty('--text',tp.text_color);
      if(tp.hint_color)s.setProperty('--hint',tp.hint_color);
      if(tp.secondary_bg_color)s.setProperty('--card-bg',tp.secondary_bg_color);
    }
  }
}catch(e){}
function go(url){window.location.href=url+'?v='+Date.now();}
</script>
</body>
</html>
