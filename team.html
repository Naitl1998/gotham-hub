<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Gotham3032 HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a1a;color:#fff}

/* HEADER */
.header{height:5vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:#12122a;border-bottom:1px solid #2a2a4a;z-index:10}
.header .back{color:#fff;text-decoration:none;font-size:clamp(14px,3.5vw,18px);cursor:pointer}
.header .title{font-size:clamp(11px,2.8vw,14px);font-weight:700;color:#e0e0ff}
.header .btc{font-size:clamp(9px,2.2vw,11px);color:#f7931a;font-weight:600;transition:opacity .3s}
.btc-fade{opacity:.3!important}

/* OFFICE */
.office{height:55vh;position:relative;overflow:hidden;background:repeating-conic-gradient(#d4b896 0% 25%,#c9a882 0% 50%) 0 0/6vw 6vw;border-bottom:2px solid #1a1a2e}
.wall{position:absolute;top:0;left:0;width:100%;height:12%;background:linear-gradient(180deg,#3e2723 0%,#5d4037 100%);display:flex;align-items:center;justify-content:space-around;padding:0 5vw}
.wall-deco{display:flex;gap:4vw;align-items:center}
.bookshelf{width:10vw;height:3vh;background:#8d6e63;border:1px solid #4e342e;border-radius:1px}
.window-shape{width:8vw;height:4vh;background:linear-gradient(135deg,#81d4fa,#4fc3f7);border:2px solid #5d4037;border-radius:2px}
.zone-label{position:absolute;left:50%;transform:translateX(-50%);font-size:clamp(8px,2vw,10px);color:rgba(255,255,255,.7);text-shadow:0 0 4px rgba(0,0,0,.8);pointer-events:none;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:3px}
.plant{position:absolute;width:2.5vw;height:2.5vw;background:radial-gradient(circle,#4caf50,#2e7d32);border-radius:50%;opacity:.7}
.mug{position:absolute;width:2vw;height:2.5vh;background:#795548;border-radius:0 0 2px 2px;border:1px solid #4e342e}
.mug::after{content:'';position:absolute;right:-1.2vw;top:20%;width:1.2vw;height:50%;border:1px solid #4e342e;border-left:none;border-radius:0 3px 3px 0}

/* CHARACTER on floor */
.char-wrap{position:absolute;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:filter .3s}
.char-wrap:hover{filter:brightness(1.2)}
.char-wrap.glow{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px var(--clr))}
.char-name{font-size:clamp(7px,1.8vw,9px);color:#fff;text-shadow:0 1px 3px #000;margin-top:1px;text-align:center;font-weight:600}
.desk{position:absolute;bottom:0;width:110%;height:30%;background:rgba(139,109,76,.7);border:1px solid #5d4037;border-radius:2px;z-index:-1}

/* CAROUSEL */
.panel{height:35vh;background:#1a1a2e;display:flex;flex-direction:column;padding:1vh 0 0 0}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:0 4vw;margin-bottom:.8vh}
.panel-title{font-size:clamp(12px,3vw,15px);font-weight:700}
.panel-sub{font-size:clamp(9px,2.2vw,11px);color:#888}
.carousel{display:flex;gap:3vw;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 4vw 1vh;flex:1;align-items:stretch;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:70vw;max-width:70vw;scroll-snap-align:start;background:#12122a;border-radius:8px;display:flex;align-items:center;padding:2vw;gap:3vw;cursor:pointer;border-left:4px solid var(--clr);transition:background .2s}
.card:hover,.card.active{background:#1e1e3a}
.card-avatar{flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:clamp(12px,3vw,14px);font-weight:700;display:flex;align-items:center;gap:1.5vw}
.status-dot{width:6px;height:6px;background:#4caf50;border-radius:50%;animation:pulse 2s infinite}
.card-role{font-size:clamp(9px,2.2vw,11px);color:#888;margin-top:2px}
.card-task{font-size:clamp(8px,2vw,10px);color:#aaa;font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-stats{font-size:clamp(8px,1.9vw,10px);color:#666;margin-top:4px}

/* POPUP */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.popup{background:#1a1a2e;border-radius:12px;padding:4vw;width:85vw;max-height:70vh;position:relative}
.popup-close{position:absolute;top:2vw;right:3vw;font-size:20px;cursor:pointer;color:#888}
.popup h3{font-size:clamp(14px,3.5vw,18px);margin-bottom:1vh}
.popup .role{color:#888;font-size:clamp(10px,2.5vw,12px);margin-bottom:1.5vh}
.popup table{width:100%;font-size:clamp(10px,2.5vw,12px)}
.popup td{padding:4px 0;border-bottom:1px solid #2a2a4a}
.popup td:first-child{color:#888}
.popup td:last-child{text-align:right;font-weight:600}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes monitorGlow{0%,100%{fill:#4fc3f7}50%{fill:#81d4fa}}
</style>
</head>
<body>

<div class="header">
  <a class="back" onclick="goBack()">←</a>
  <span class="title">⚡ Gotham3032 HQ</span>
  <span class="btc" id="btcPrice">BTC ...</span>
</div>

<div class="office" id="office">
  <div class="wall">
    <div class="wall-deco">
      <div class="bookshelf"></div>
      <div class="window-shape"></div>
      <div class="bookshelf"></div>
      <div class="window-shape"></div>
    </div>
  </div>
  <div class="zone-label" style="top:36%">📊 Аналитики</div>
  <div class="zone-label" style="top:72%">💰 Трейдеры</div>
  <div class="plant" style="left:5%;top:50%"></div>
  <div class="plant" style="left:88%;top:30%"></div>
  <div class="plant" style="left:92%;top:70%"></div>
  <div class="mug" style="left:45%;top:48%"></div>
</div>

<div class="panel">
  <div class="panel-header">
    <span class="panel-title">👥 Команда</span>
    <span class="panel-sub">7 агентов активно</span>
  </div>
  <div class="carousel" id="carousel"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popup"></div>
</div>

<script>
const agents=[
{id:'alf',name:'Альф',role:'Аналитик',color:'#7c4dff',task:'Сканирует рынок BTC',strategy:'Технический анализ + ML',hat:'beanie',row:0,col:0},
{id:'nova',name:'Нова',role:'Аналитик',color:'#e53935',task:'Анализ новостного фона',strategy:'Sentiment + NLP',hat:'beret',row:0,col:1},
{id:'satoshi',name:'Сатоши',role:'Аналитик',color:'#263238',task:'Мониторинг on-chain',strategy:'On-chain метрики',hat:'hood',row:0,col:2},
{id:'orakl',name:'Оракл',role:'Аналитик',color:'#9c27b0',task:'Прогноз волатильности',strategy:'Статистический анализ',hat:'wizard',row:0,col:3},
{id:'rita',name:'Рита',role:'Трейдер',color:'#e91e8a',task:'Скальпинг ETH/USDT',strategy:'Скальпинг',hat:'pinkbeanie',row:1,col:0},
{id:'hedge',name:'Хедж',role:'Трейдер',color:'#4caf50',task:'Хеджирование портфеля',strategy:'Хеджирование деривативами',hat:'ushanka',row:1,col:1},
{id:'bot9',name:'Бот-9000',role:'Трейдер',color:'#90a4ae',task:'HFT арбитраж',strategy:'Алгоритмический HFT',hat:'robot',row:1,col:2}
];

function makeSVG(a,size){
  const s=size||40,vb=`0 0 40 55`;
  const isBot=a.hat==='robot';
  const headR=10,headCY=14,bodY=26,bodH=16;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${s}" height="${s*1.375}">`;
  // desk
  svg+=`<rect x="2" y="38" width="36" height="10" rx="1" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>`;
  // monitor
  svg+=`<rect x="14" y="34" width="12" height="8" rx="1" fill="#263238" stroke="#455a64" stroke-width="1"/>`;
  svg+=`<rect x="16" y="36" width="8" height="4" rx="0" fill="#4fc3f7"><animate attributeName="fill" values="#4fc3f7;#81d4fa;#4fc3f7" dur="3s" repeatCount="indefinite"/></rect>`;
  // body
  svg+=`<rect x="14" y="${bodY}" width="12" height="${bodH}" rx="3" fill="${a.color}" stroke="#000" stroke-width="1.5"/>`;
  // head
  if(isBot){
    svg+=`<rect x="11" y="4" width="18" height="18" rx="2" fill="#cfd8dc" stroke="#000" stroke-width="1.5"/>`;
    // antenna
    svg+=`<line x1="20" y1="4" x2="20" y2="0" stroke="#666" stroke-width="1.5"/>`;
    svg+=`<circle cx="20" cy="0" r="2" fill="#f44336"/>`;
    // LED eyes
    svg+=`<rect x="14" y="9" width="4" height="4" rx="0.5" fill="#4fc3f7" stroke="#000" stroke-width="0.5"/>`;
    svg+=`<rect x="22" y="9" width="4" height="4" rx="0.5" fill="#4fc3f7" stroke="#000" stroke-width="0.5"/>`;
    // mouth
    svg+=`<rect x="16" y="17" width="8" height="1.5" rx="0.5" fill="#455a64"/>`;
  } else {
    svg+=`<circle cx="20" cy="${headCY}" r="${headR}" fill="#FDDEB5" stroke="#000" stroke-width="1.5"/>`;
    // eyes
    svg+=`<ellipse cx="16" cy="13" rx="2.5" ry="3" fill="#fff"/>`;
    svg+=`<ellipse cx="24" cy="13" rx="2.5" ry="3" fill="#fff"/>`;
    svg+=`<circle cx="16.5" cy="13.5" r="1.2" fill="#000"/>`;
    svg+=`<circle cx="24.5" cy="13.5" r="1.2" fill="#000"/>`;
    // mouth
    svg+=`<path d="M17 19 Q20 22 23 19" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round"/>`;
    // hats
    if(a.hat==='beanie') svg+=`<path d="M10 10 Q10 2 20 2 Q30 2 30 10" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
    if(a.hat==='beret'){
      svg+=`<ellipse cx="22" cy="6" rx="10" ry="4" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
      // glasses
      svg+=`<circle cx="16" cy="13" r="3.5" fill="none" stroke="#333" stroke-width="1"/>`;
      svg+=`<circle cx="24" cy="13" r="3.5" fill="none" stroke="#333" stroke-width="1"/>`;
      svg+=`<line x1="19.5" y1="13" x2="20.5" y2="13" stroke="#333" stroke-width="0.8"/>`;
    }
    if(a.hat==='hood') svg+=`<path d="M10 16 Q10 1 20 1 Q30 1 30 16" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
    if(a.hat==='wizard') svg+=`<polygon points="20,0 10,12 30,12" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
    if(a.hat==='pinkbeanie'){
      svg+=`<path d="M10 10 Q10 2 20 2 Q30 2 30 10" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
      // ponytail
      svg+=`<path d="M30 12 Q36 10 34 16" stroke="${a.color}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    }
    if(a.hat==='ushanka'){
      svg+=`<rect x="10" y="4" width="20" height="8" rx="2" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
      // ear flaps
      svg+=`<rect x="7" y="8" width="5" height="8" rx="1.5" fill="${a.color}" stroke="#000" stroke-width="0.8"/>`;
      svg+=`<rect x="28" y="8" width="5" height="8" rx="1.5" fill="${a.color}" stroke="#000" stroke-width="0.8"/>`;
    }
  }
  svg+=`</svg>`;
  return svg;
}

// Place characters on office floor
const office=document.getElementById('office');
const row0X=[12,32,52,72]; // % left for row 0 (4 analysts)
const row1X=[18,42,66]; // % left for row 1 (3 traders)

agents.forEach((a,i)=>{
  const wrap=document.createElement('div');
  wrap.className='char-wrap';
  wrap.id='char-'+a.id;
  wrap.style.setProperty('--clr',a.color);
  const xs=a.row===0?row0X:row1X;
  wrap.style.left=xs[a.col]+'%';
  wrap.style.top=a.row===0?'14%':'52%';
  wrap.style.animation=`bob ${1.8+i*0.3}s ease-in-out infinite`;
  wrap.innerHTML=makeSVG(a,parseInt(window.innerWidth*0.08))+`<span class="char-name">${a.name}</span>`;
  wrap.onclick=()=>showPopup(a);
  office.appendChild(wrap);
});

// Carousel cards
const carousel=document.getElementById('carousel');
agents.forEach((a,i)=>{
  const card=document.createElement('div');
  card.className='card';
  card.style.setProperty('--clr',a.color);
  card.innerHTML=`
    <div class="card-avatar">${makeSVG(a,parseInt(window.innerWidth*0.12))}</div>
    <div class="card-info">
      <div class="card-name">${a.name} <span class="status-dot"></span></div>
      <div class="card-role">${a.role}</div>
      <div class="card-task">${a.task}</div>
      <div class="card-stats">Баланс $10,000 · Сделок: 0 · Win: —%</div>
    </div>`;
  card.onclick=()=>{
    document.querySelectorAll('.char-wrap').forEach(c=>c.classList.remove('glow'));
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');
    const el=document.getElementById('char-'+a.id);
    if(el)el.classList.add('glow');
  };
  carousel.appendChild(card);
});

// Popup
function showPopup(a){
  const p=document.getElementById('popup');
  p.innerHTML=`
    <span class="popup-close" onclick="closePopup()">✕</span>
    <h3 style="color:${a.color}">${a.name}</h3>
    <div class="role">${a.role}</div>
    <table>
      <tr><td>Стратегия</td><td>${a.strategy}</td></tr>
      <tr><td>Текущая задача</td><td>${a.task}</td></tr>
      <tr><td>Баланс</td><td>$10,000</td></tr>
      <tr><td>Сделок</td><td>0</td></tr>
      <tr><td>Win Rate</td><td>—%</td></tr>
      <tr><td>P&L</td><td>$0</td></tr>
      <tr><td>Статус</td><td>🟢 Активен</td></tr>
    </table>`;
  document.getElementById('overlay').classList.add('show');
}
function closePopup(){document.getElementById('overlay').classList.remove('show')}

// BTC price
async function fetchBTC(){
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const d=await r.json();
    const el=document.getElementById('btcPrice');
    el.classList.add('btc-fade');
    setTimeout(()=>{
      el.textContent='₿ '+parseFloat(d.price).toLocaleString('en',{maximumFractionDigits:0});
      el.classList.remove('btc-fade');
    },300);
  }catch(e){document.getElementById('btcPrice').textContent='BTC —'}
}
fetchBTC();setInterval(fetchBTC,15000);

// Telegram
function goBack(){
  try{window.Telegram.WebApp.BackButton.hide()}catch(e){}
  window.location.href='index.html';
}
try{
  const tg=window.Telegram.WebApp;
  tg.ready();tg.expand();
  tg.BackButton.show();
  tg.BackButton.onClick(()=>{window.location.href='index.html'});
}catch(e){}
</script>
</body>
</html>
