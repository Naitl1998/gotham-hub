<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a1a;color:#fff}

.header{height:5vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:#12122a;border-bottom:1px solid #2a2a4a;z-index:10}
.header .back{color:#fff;text-decoration:none;font-size:clamp(14px,3.5vw,18px);cursor:pointer}
.header .title{font-size:clamp(11px,2.8vw,14px);font-weight:700;color:#e0e0ff}
.header .btc{font-size:clamp(9px,2.2vw,11px);color:#f7931a;font-weight:600;transition:opacity .3s}
.header .clock{font-size:clamp(8px,2vw,10px);color:#888}
.btc-fade{opacity:.3!important}

/* OFFICE FLOOR PLAN */
.office{height:55vh;position:relative;overflow:hidden;background:#2a2a2a;border-bottom:2px solid #1a1a2e}

/* Rooms */
.room{position:absolute;overflow:hidden}
.room-boss{left:0;top:0;width:35%;height:45%;background:#e8d5a8}
.room-analytics{left:35%;top:0;width:65%;height:45%;background:#ddd0b8}
.room-lounge{left:0;top:45%;width:35%;height:55%;background:#e8d5a8}
.room-trading{left:35%;top:45%;width:65%;height:55%;background:#ddd0b8}

/* Walls - thick dark lines */
.wall-h,.wall-v{position:absolute;background:#3e2723;z-index:5}
.wall-h{height:3px}
.wall-v{width:3px}

/* Outer walls */
.wall-top{left:0;top:0;width:100%}
.wall-bottom{left:0;bottom:0;width:100%}
.wall-left{left:0;top:0;height:100%}
.wall-right{right:0;top:0;height:100%}

/* Inner walls - horizontal divider at 45% */
.wall-mid-h-left{left:0;top:45%;width:15%}
.wall-mid-h-left2{left:22%;top:45%;width:13%}
.wall-mid-h-right{left:42%;top:45%;width:23%}
.wall-mid-h-right2{left:72%;top:45%;width:28%}

/* Inner walls - vertical divider at 35% */
.wall-mid-v-top{left:35%;top:0;height:18%}
.wall-mid-v-top2{left:35%;top:26%;height:19%}
.wall-mid-v-bot{left:35%;top:45%;height:22%}
.wall-mid-v-bot2{left:35%;top:75%;height:25%}

/* Door indicators */
.door{position:absolute;z-index:6}
.door-h{height:3px;background:#e8d5a8}
.door-v{width:3px}
.door-boss-lounge{left:15%;top:45%;width:7%;background:#e8d5a8}
.door-boss-analytics{left:35%;top:18%;height:8%;background:#ddd0b8}
.door-analytics-trading{left:65%;top:45%;width:7%;background:#ddd0b8}
.door-lounge-trading{left:35%;top:67%;height:8%;background:#ddd0b8}

/* Room labels */
.room-label{position:absolute;font-size:clamp(7px,1.8vw,9px);color:rgba(60,40,20,.6);font-weight:700;pointer-events:none;z-index:3;letter-spacing:.5px}

/* Furniture - all top-down CSS */
.desk{position:absolute;background:#b0b0b0;border:1px solid #888;border-radius:1px;z-index:2}
.monitor{position:absolute;background:#263238;border-radius:1px;z-index:3}
.monitor-screen{position:absolute;border-radius:1px;z-index:3;animation:monGlow 3s infinite}
.chair{position:absolute;border-radius:50%;background:#666;border:1px solid #444;z-index:2}
.big-desk{position:absolute;background:#9e8e6e;border:1.5px solid #6d5c3d;border-radius:2px;z-index:2}
.bookshelf{position:absolute;background:#6d4c41;border:1px solid #4e342e;z-index:2;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:1px;overflow:hidden}
.book{width:80%;height:2px;border-radius:1px}
.plant-top{position:absolute;width:3vw;height:3vw;background:radial-gradient(circle,#66bb6a,#2e7d32);border-radius:50%;z-index:3}
.pot{position:absolute;width:2vw;height:1.5vw;background:#8d6e63;border-radius:0 0 2px 2px;z-index:2}
.sofa{position:absolute;background:#8b2020;border-radius:4px;z-index:2;border:1px solid #5a1010}
.coffee-table{position:absolute;background:#8d6e63;border:1px solid #5d4037;border-radius:2px;z-index:2}
.fridge{position:absolute;background:#9e9e9e;border:1px solid #757575;border-radius:2px;z-index:2;display:flex;align-items:center;justify-content:center;font-size:clamp(4px,1vw,6px);color:#333;font-weight:700}
.coffee-machine{position:absolute;background:#4e342e;border:1px solid #3e2723;border-radius:1px;z-index:2}
.steam{position:absolute;width:2px;height:2px;background:rgba(255,255,255,.6);border-radius:50%;animation:steam 1.5s infinite;z-index:4}
.tv{position:absolute;background:#212121;border:1px solid #111;border-radius:1px;z-index:2}
.whiteboard{position:absolute;background:#f5f5f5;border:1.5px solid #bbb;border-radius:1px;z-index:2;display:flex;align-items:center;justify-content:center;font-size:clamp(4px,1vw,6px);color:#333;font-weight:600}
.water-cooler{position:absolute;background:linear-gradient(180deg,#bbdefb,#e3f2fd);border:1px solid #90caf9;border-radius:2px;z-index:2}
.nameplate{position:absolute;background:#ffd54f;border:1px solid #f9a825;border-radius:2px;z-index:3;font-size:clamp(5px,1.3vw,7px);color:#333;font-weight:700;padding:0 2px;text-align:center;white-space:nowrap}
.ticker-wall{position:absolute;background:#1a237e;border:1px solid #0d1b5e;border-radius:1px;z-index:2;display:flex;align-items:center;justify-content:center;font-size:clamp(4px,.9vw,5px);color:#4fc3f7;font-weight:600;overflow:hidden}

/* Characters on floor */
.char-wrap{position:absolute;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:filter .3s;z-index:4}
.char-wrap:hover{filter:brightness(1.2)}
.char-wrap.glow{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px var(--clr))}
.char-name{font-size:clamp(5px,1.4vw,7px);color:#333;text-shadow:0 0 2px rgba(255,255,255,.5);margin-top:0;text-align:center;font-weight:700}

/* CAROUSEL */
.panel{height:35vh;background:#1a1a2e;display:flex;flex-direction:column;padding:1vh 0 0 0}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:0 4vw;margin-bottom:.6vh}
.panel-title{font-size:clamp(12px,3vw,15px);font-weight:700}
.panel-sub{font-size:clamp(9px,2.2vw,11px);color:#888}
.carousel{display:flex;gap:3vw;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 4vw 1vh;flex:1;align-items:stretch;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:70vw;max-width:70vw;scroll-snap-align:start;background:#12122a;border-radius:8px;display:flex;align-items:center;padding:2vw;gap:3vw;cursor:pointer;border-left:4px solid var(--clr);transition:background .2s}
.card:hover,.card.active{background:#1e1e3a}
.card-avatar{flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:clamp(12px,3vw,14px);font-weight:700;display:flex;align-items:center;gap:1.5vw}
.status-dot{width:6px;height:6px;background:#4caf50;border-radius:50%;animation:pulse 2s infinite}
.card-role{font-size:clamp(9px,2.2vw,11px);color:#888;margin-top:2px}
.card-task{font-size:clamp(8px,2vw,10px);color:#aaa;font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-stats{font-size:clamp(8px,1.9vw,10px);color:#666;margin-top:4px}

/* POPUP */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.popup{background:#1a1a2e;border-radius:12px;padding:4vw;width:85vw;max-height:70vh;position:relative}
.popup-close{position:absolute;top:2vw;right:3vw;font-size:20px;cursor:pointer;color:#888}
.popup h3{font-size:clamp(14px,3.5vw,18px);margin-bottom:1vh}
.popup .role{color:#888;font-size:clamp(10px,2.5vw,12px);margin-bottom:1.5vh}
.popup table{width:100%;font-size:clamp(10px,2.5vw,12px)}
.popup td{padding:4px 0;border-bottom:1px solid #2a2a4a}
.popup td:first-child{color:#888}
.popup td:last-child{text-align:right;font-weight:600}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes monGlow{0%,100%{background:#4fc3f7}50%{background:#81d4fa}}
@keyframes steam{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.7}}
</style>
</head>

function makeSVG(a,size){
  const s=size||28;
  const isBot=a.hat==='robot';
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 42" width="${s}" height="${s*1.05}">`;
  // body
  svg+=`<rect x="14" y="22" width="12" height="14" rx="3" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
  // head
  if(isBot){
    svg+=`<rect x="11" y="4" width="18" height="16" rx="2" fill="#cfd8dc" stroke="#000" stroke-width="1.2"/>`;
    svg+=`<line x1="20" y1="4" x2="20" y2="0" stroke="#666" stroke-width="1.5"/>`;
    svg+=`<circle cx="20" cy="0" r="2" fill="#f44336"/>`;
    svg+=`<rect x="14" y="9" width="4" height="4" rx=".5" fill="#4fc3f7" stroke="#000" stroke-width=".5"/>`;
    svg+=`<rect x="22" y="9" width="4" height="4" rx=".5" fill="#4fc3f7" stroke="#000" stroke-width=".5"/>`;
    svg+=`<rect x="16" y="16" width="8" height="1.5" rx=".5" fill="#455a64"/>`;
  } else {
    svg+=`<circle cx="20" cy="12" r="10" fill="#FDDEB5" stroke="#000" stroke-width="1.2"/>`;
    svg+=`<ellipse cx="16" cy="11" rx="2.2" ry="2.8" fill="#fff"/>`;

    }
    if(a.hat==='hood') svg+=`<path d="M10 14 Q10 0 20 0 Q30 0 30 14" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
    if(a.hat==='wizard') svg+=`<polygon points="20,-2 10,10 30,10" fill="${a.color}" stroke="#000" stroke-width=".8"/>`;

function makeCardSVG(a){
  const s=44;
  const isBot=a.hat==='robot';
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 55" width="${s}" height="${s*1.375}">`;
  svg+=`<rect x="2" y="38" width="36" height="10" rx="1" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>`;
  svg+=`<rect x="14" y="34" width="12" height="8" rx="1" fill="#263238" stroke="#455a64" stroke-width="1"/>`;
  svg+=`<rect x="16" y="36" width="8" height="4" rx="0" fill="#4fc3f7"><animate attributeName="fill" values="#4fc3f7;#81d4fa;#4fc3f7" dur="3s" repeatCount="indefinite"/></rect>`;
  svg+=`<rect x="14" y="22" width="12" height="14" rx="3" fill="${a.color}" stroke="#000" stroke-width="1.5"/>`;
  if(isBot){
    svg+=`<rect x="11" y="4" width="18" height="18" rx="2" fill="#cfd8dc" stroke="#000" stroke-width="1.5"/>`;
    svg+=`<line x1="20" y1="4" x2="20" y2="0" stroke="#666" stroke-width="1.5"/>`;
    svg+=`<circle cx="20" cy="0" r="2" fill="#f44336"/>`;
    svg+=`<rect x="14" y="9" width="4" height="4" rx=".5" fill="#4fc3f7" stroke="#000" stroke-width=".5"/>`;
    svg+=`<rect x="22" y="9" width="4" height="4" rx=".5" fill="#4fc3f7" stroke="#000" stroke-width=".5"/>`;
    svg+=`<rect x="16" y="17" width="8" height="1.5" rx=".5" fill="#455a64"/>`;
  } else {
    svg+=`<circle cx="20" cy="14" r="10" fill="#FDDEB5" stroke="#000" stroke-width="1.5"/>`;
    svg+=`<ellipse cx="16" cy="13" rx="2.5" ry="3" fill="#fff"/>`;
    svg+=`<ellipse cx="24" cy="13" rx="2.5" ry="3" fill="#fff"/>`;
    svg+=`<circle cx="16.5" cy="13.5" r="1.2" fill="#000"/>`;
    svg+=`<circle cx="24.5" cy="13.5" r="1.2" fill="#000"/>`;
    svg+=`<path d="M17 19 Q20 22 23 19" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round"/>`;
    if(a.hat==='beanie') svg+=`<path d="M10 10 Q10 2 20 2 Q30 2 30 10" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
    if(a.hat==='beret'){
      svg+=`<ellipse cx="22" cy="6" rx="10" ry="4" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
      svg+=`<circle cx="16" cy="13" r="3.5" fill="none" stroke="#333" stroke-width="1"/>`;
      svg+=`<circle cx="24" cy="13" r="3.5" fill="none" stroke="#333" stroke-width="1"/>`;
      svg+=`<line x1="19.5" y1="13" x2="20.5" y2="13" stroke="#333" stroke-width=".8"/>`;
    }
    if(a.hat==='hood') svg+=`<path d="M10 16 Q10 1 20 1 Q30 1 30 16" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
    if(a.hat==='wizard') svg+=`<polygon points="20,0 10,12 30,12" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
    if(a.hat==='pinkbeanie'){
      svg+=`<path d="M10 10 Q10 2 20 2 Q30 2 30 10" fill="${a.color}" stroke="#000" stroke-width="1.2"/>`;
      svg+=`<path d="M30 12 Q36 10 34 16" stroke="${a.color}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    }
    if(a.hat==='ushanka'){
      svg+=`<rect x="10" y="4" width="20" height="8" rx="2" fill="${a.color}" stroke="#000" stroke-width="1"/>`;
      svg+=`<rect x="7" y="8" width="5" height="8" rx="1.5" fill="${a.color}" stroke="#000" stroke-width=".8"/>`;
      svg+=`<rect x="28" y="8" width="5" height="8" rx="1.5" fill="${a.color}" stroke="#000" stroke-width=".8"/>`;
    }
  }
  svg+=`</svg>`;
  return svg;
}

// Place characters
const office=document.getElementById('office');
const charSize=Math.max(20,Math.min(parseInt(window.innerWidth*0.07),32));

agents.forEach((a,i)=>{
  const wrap=document.createElement('div');
  wrap.className='char-wrap';
  wrap.id='char-'+a.id;
  wrap.style.setProperty('--clr',a.color);
  wrap.style.left=a.pos.left;
  wrap.style.top=a.pos.top;
  wrap.style.animation=`bob ${1.8+i*0.3}s ease-in-out infinite`;
  wrap.innerHTML=makeSVG(a,charSize)+`<span class="char-name">${a.name}</span>`;
  wrap.onclick=()=>showPopup(a);
  office.appendChild(wrap);
});

// Carousel
const carousel=document.getElementById('carousel');
agents.forEach((a,i)=>{
  const card=document.createElement('div');
  card.className='card';
  card.style.setProperty('--clr',a.color);
  card.innerHTML=`
    <div class="card-avatar">${makeCardSVG(a)}</div>
    <div class="card-info">
      <div class="card-name">${a.name} <span class="status-dot"></span></div>
      <div class="card-role">${a.role}</div>
      <div class="card-task">${a.task}</div>
      <div class="card-stats">Баланс $10,000 · Сделок: 0 · Win: —%</div>
    </div>`;
  card.onclick=()=>{
    document.querySelectorAll('.char-wrap').forEach(c=>c.classList.remove('glow'));
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');
    const el=document.getElementById('char-'+a.id);
    if(el)el.classList.add('glow');
  };
  carousel.appendChild(card);
});

// Popup
function showPopup(a){
  const p=document.getElementById('popup');
  p.innerHTML=`
    <span class="popup-close" onclick="closePopup()">✕</span>
    <h3 style="color:${a.color}">${a.name}</h3>
    <div class="role">${a.role}</div>
    <table>
      <tr><td>Стратегия</td><td>${a.strategy}</td></tr>
      <tr><td>Текущая задача</td><td>${a.task}</td></tr>
      <tr><td>Баланс</td><td>$10,000</td></tr>
      <tr><td>Сделок</td><td>0</td></tr>
      <tr><td>Win Rate</td><td>—%</td></tr>
      <tr><td>P&L</td><td>$0</td></tr>
      <tr><td>Статус</td><td>🟢 Активен</td></tr>
    </table>`;
  document.getElementById('overlay').classList.add('show');
}
function closePopup(){document.getElementById('overlay').classList.remove('show')}

// BTC price
let btcPriceVal='';
async function fetchBTC(){
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const d=await r.json();
    btcPriceVal=parseFloat(d.price).toLocaleString('en',{maximumFractionDigits:0});
    const el=document.getElementById('btcPrice');
    el.classList.add('btc-fade');
    setTimeout(()=>{
      el.textContent='₿ '+btcPriceVal;
      el.classList.remove('btc-fade');
    },300);
    // Update whiteboard
    document.getElementById('whiteboard').textContent='BTC $'+btcPriceVal;
  }catch(e){document.getElementById('btcPrice').textContent='BTC —'}
}
fetchBTC();setInterval(fetchBTC,15000);

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}
updateClock();setInterval(updateClock,30000);
