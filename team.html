<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Команда — GOTHAM3032 HQ</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Inter',sans-serif;background:#87CEEB}
#scene{position:relative;width:100vw;height:100vh;overflow:hidden}

/* Sky / outside */
.sky{position:absolute;top:0;left:0;width:100%;height:45vh;background:linear-gradient(180deg,#87CEEB 0%,#B0E0FF 100%)}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.9}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1{width:8vw;height:3vh;top:8vh;left:5vw;animation:drift 30s linear infinite}
.c1::before{width:5vw;height:2.5vh;top:-1.5vh;left:1.5vw}
.c1::after{width:4vw;height:2vh;top:-1vh;left:4vw}
.c2{width:6vw;height:2.5vh;top:5vh;left:25vw;animation:drift 40s linear infinite 5s}
.c2::before{width:4vw;height:2vh;top:-1.2vh;left:1vw}
.c2::after{width:3vw;height:1.5vh;top:-.8vh;left:3vw}
.c3{width:7vw;height:2.8vh;top:12vh;left:60vw;animation:drift 35s linear infinite 10s}
.c3::before{width:5vw;height:2.2vh;top:-1.3vh;left:1vw}
.c3::after{width:3.5vw;height:1.8vh;top:-1vh;left:3.5vw}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(100vw)}}

/* Room structure */
.ceiling{position:absolute;top:18vh;left:8vw;width:84vw;height:2.5vh;background:#8B7355;border:2px solid #333;z-index:2}
.wall{position:absolute;top:20vh;left:8vw;width:84vw;height:58vh;background:#F5E6CA;border-left:3px solid #333;border-right:3px solid #333;z-index:1}
.floor{position:absolute;bottom:0;left:0;width:100vw;height:22vh;background:#8B7355;border-top:3px solid #333;z-index:2}
.floor-tile{position:absolute;top:20.5vh;left:8vw;width:84vw;height:2vh;background:#A0896C;z-index:3}
.baseboard{position:absolute;top:76vh;left:8vw;width:84vw;height:1.5vh;background:#6B5B3E;border:1px solid #333;z-index:3}

/* Window */
.window{position:absolute;top:26vh;left:12vw;width:14vw;height:16vh;background:#B0E0FF;border:3px solid #333;z-index:2}
.window-cross-h{position:absolute;top:50%;left:0;width:100%;height:3px;background:#333;transform:translateY(-50%)}
.window-cross-v{position:absolute;top:0;left:50%;width:3px;height:100%;background:#333;transform:translateX(-50%)}
.window-sill{position:absolute;top:42vh;left:11vw;width:16vw;height:1.5vh;background:#8B7355;border:2px solid #333;z-index:2}

/* Door */
.door{position:absolute;top:50vh;right:10vw;width:8vw;height:27.5vh;background:#A0522D;border:3px solid #333;border-bottom:none;z-index:2;border-radius:1vh 1vh 0 0}
.door-knob{position:absolute;top:55%;left:15%;width:1.2vw;height:1.2vw;background:#DAA520;border:2px solid #333;border-radius:50%}

/* Wall decorations */
.poster{position:absolute;top:28vh;left:42vw;width:14vw;height:8vh;background:#1a1a2e;border:3px solid #333;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column}
.poster-text{color:#FFD700;font-size:1.4vh;font-weight:700;text-align:center;line-height:1.3}

.whiteboard{position:absolute;top:26vh;left:58vw;width:16vw;height:12vh;background:#fff;border:3px solid #333;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:.5vh}
.wb-title{font-size:1.3vh;font-weight:700;color:#333}
.wb-price{font-size:2vh;font-weight:700;color:#F7931A;margin-top:.3vh}
.wb-label{font-size:1vh;color:#666;margin-top:.2vh}

.clock{position:absolute;top:28vh;left:34vw;width:5vw;height:5vw;max-width:5vh;max-height:5vh;background:#fff;border:3px solid #333;border-radius:50%;z-index:2}
.clock-center{position:absolute;top:50%;left:50%;width:.6vh;height:.6vh;background:#333;border-radius:50%;transform:translate(-50%,-50%);z-index:4}
.hand-h{position:absolute;bottom:50%;left:50%;width:2px;height:30%;background:#333;transform-origin:bottom center;z-index:3}
.hand-m{position:absolute;bottom:50%;left:50%;width:1.5px;height:40%;background:#333;transform-origin:bottom center;z-index:3}

/* Zone labels */
.zone-label{position:absolute;top:22vh;font-size:1.2vh;font-weight:700;color:#555;letter-spacing:.1vw;z-index:3}
.zone-left{left:14vw}
.zone-right{left:60vw}

/* Boss TV */
.boss-tv{position:absolute;top:25vh;left:76vw;width:14vw;height:10vh;background:#111;border:3px solid #333;border-radius:.5vh;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5vh}
.boss-tv::after{content:'';position:absolute;bottom:-2vh;left:50%;transform:translateX(-50%);width:4vw;height:2vh;background:#333;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.tv-name{color:#FFD700;font-size:1.3vh;font-weight:700}
.tv-stats{color:#0f0;font-size:1vh;margin-top:.3vh;text-align:center;line-height:1.4}

/* Furniture */
.fridge{position:absolute;bottom:22vh;left:9.5vw;width:5vw;height:14vh;background:#D0D0D0;border:3px solid #333;border-radius:.5vh .5vh 0 0;z-index:3}
.fridge-line{position:absolute;top:45%;left:10%;width:80%;height:2px;background:#333}
.fridge-handle{position:absolute;top:20%;right:15%;width:.6vw;height:2vh;background:#999;border:1px solid #333;border-radius:1px}

.coffee{position:absolute;bottom:22vh;left:15.5vw;width:3.5vw;height:6vh;background:#2C2C2C;border:2px solid #333;border-radius:.3vh .3vh 0 0;z-index:3}
.coffee-top{position:absolute;top:-.8vh;left:15%;width:70%;height:1vh;background:#444;border:2px solid #333;border-radius:.3vh}
.steam{position:absolute;top:-2.5vh;width:.4vw;height:2vh;background:transparent;z-index:4}
.s1{left:25%;animation:steam 2s ease-in-out infinite}
.s2{left:55%;animation:steam 2s ease-in-out infinite .7s}
@keyframes steam{0%{box-shadow:0 0 .5vh .2vh rgba(255,255,255,0)}25%{box-shadow:0 0 .5vh .2vh rgba(255,255,255,.4)}50%{box-shadow:0 -.5vh .5vh .2vh rgba(255,255,255,.2);transform:translateX(.2vw)}100%{box-shadow:0 -1vh .5vh .2vh rgba(255,255,255,0);transform:translateY(-1vh)}}

.cooler{position:absolute;bottom:22vh;right:19vw;width:3vw;height:8vh;background:#ADD8E6;border:2px solid #333;border-radius:.3vh;z-index:3}
.cooler-bottle{position:absolute;top:-3vh;left:15%;width:70%;height:3.5vh;background:#89CFF0;border:2px solid #333;border-radius:50% 50% 0 0}
.cooler-tap{position:absolute;top:40%;left:-5%;width:1vw;height:1vh;background:#999;border:1px solid #333}

.plant{position:absolute;bottom:22vh;right:11vw;z-index:3}
.plant-pot{width:3vw;height:3vh;background:#A0522D;border:2px solid #333;clip-path:polygon(10% 0,90% 0,80% 100%,20% 100%)}
.plant-leaves{position:absolute;bottom:2.5vh;left:50%;transform:translateX(-50%)}
.leaf{position:absolute;width:1.5vw;height:3vh;background:#228B22;border:2px solid #333;border-radius:50%}
.leaf:nth-child(1){transform:rotate(-30deg);left:-1.2vw}
.leaf:nth-child(2){transform:rotate(0deg);left:-.4vw;bottom:.5vh}
.leaf:nth-child(3){transform:rotate(30deg);left:.5vw}

/* Desk */
.desk{position:absolute;width:9vw;height:3.5vh;background:#8B6914;border:2px solid #333;z-index:4}
.desk-leg-l,.desk-leg-r{position:absolute;bottom:-3vh;width:.8vw;height:3vh;background:#7A5C12;border:1px solid #333}
.desk-leg-l{left:.5vw}
.desk-leg-r{right:.5vw}
.monitor{position:absolute;top:-4vh;left:50%;transform:translateX(-50%);width:4vw;height:3vh;background:#222;border:2px solid #333;border-radius:.3vh;z-index:5}
.monitor-screen{position:absolute;top:10%;left:8%;width:84%;height:70%;border-radius:.15vh;animation:flicker 3s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.85}52%{opacity:1}}
.monitor-stand{position:absolute;bottom:-1vh;left:50%;transform:translateX(-50%);width:1.5vw;height:1vh;background:#333;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}

/* Character base */
.char{position:absolute;z-index:6;cursor:pointer;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* Speech bubble */
.bubble{position:absolute;top:-4vh;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #333;border-radius:1vh;padding:.3vh .6vw;font-size:1vh;white-space:nowrap;z-index:10;opacity:0;transition:opacity .3s;pointer-events:none}
.bubble::after{content:'';position:absolute;bottom:-1vh;left:50%;transform:translateX(-50%);width:0;height:0;border-left:.5vw solid transparent;border-right:.5vw solid transparent;border-top:1vh solid #333}
.bubble.show{opacity:1}

/* Tooltip card */
.tooltip{position:fixed;z-index:100;background:#1a1a2e;color:#fff;border:2px solid #FFD700;border-radius:1.5vh;padding:1.5vh 2vw;min-width:30vw;max-width:60vw;display:none;box-shadow:0 .5vh 2vh rgba(0,0,0,.5)}
.tooltip.active{display:block}
.tt-name{font-size:2vh;font-weight:700;color:#FFD700;margin-bottom:.5vh}
.tt-role{font-size:1.4vh;color:#aaa;margin-bottom:.8vh}
.tt-strat{font-size:1.2vh;color:#ccc;margin-bottom:.8vh;font-style:italic}
.tt-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5vh;font-size:1.2vh}
.tt-stat{text-align:center;padding:.4vh;background:rgba(255,255,255,.08);border-radius:.5vh}
.tt-stat-val{font-size:1.6vh;font-weight:700;color:#0f0}
.tt-stat-lbl{font-size:.9vh;color:#888}

/* Back button */
.back-btn{position:fixed;top:1.5vh;left:1.5vw;z-index:50;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:5vh;height:5vh;font-size:2.5vh;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back-btn:active{background:rgba(0,0,0,.7)}

/* Character SVGs inline */
.char svg{display:block}
</style>
</head>

<script>
// Telegram WebApp
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}

// Clock
function updateClock(){
  const now=new Date();
  const h=(now.getHours()%12)*30+now.getMinutes()*.5;
  const m=now.getMinutes()*6;
  document.getElementById('handH').style.transform=`rotate(${h}deg)`;
  document.getElementById('handM').style.transform=`rotate(${m}deg)`;
}
setInterval(updateClock,1000);updateClock();

// BTC price
async function fetchBTC(){
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const d=await r.json();
    const p=parseFloat(d.price).toLocaleString('en-US',{maximumFractionDigits:0});
    document.getElementById('btcPrice').textContent='$'+p;
  }catch(e){document.getElementById('btcPrice').textContent='$ERR'}
}
fetchBTC();setInterval(fetchBTC,15000);

// Tooltip
const tip=document.getElementById('tooltip');
function showTip(el){
  event.stopPropagation();
  document.getElementById('ttName').textContent=el.dataset.name;
  document.getElementById('ttRole').textContent=el.dataset.role;
  document.getElementById('ttStrat').textContent='«'+el.dataset.strat+'»';
  document.getElementById('ttBal').textContent=el.dataset.bal;
  document.getElementById('ttTrades').textContent=el.dataset.trades;
  document.getElementById('ttWin').textContent=el.dataset.win;
  const r=el.getBoundingClientRect();
  let x=r.left+r.width/2;
  let y=r.top-10;
  tip.classList.add('active');
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  x=Math.max(5,Math.min(x-tw/2,window.innerWidth-tw-5));
  y=y-th;if(y<5)y=r.bottom+10;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
document.addEventListener('click',()=>tip.classList.remove('active'));

// Speech bubbles
const phrases=['Хмм... 🤔','Лонг! 🚀','Шорт! 📉','HODL! 💎','Покупаем!','Продаём!','Кофе... ☕','Биток растёт!','Медведи идут 🐻','Быки рулят 🐂','Риск/ревард 👌','Ликвидация! 😱','Профит! 💰','Анализирую...','Сигнал!','К луне! 🌙'];
function showBubble(){
  const i=Math.floor(Math.random()*7)+1;
  const b=document.getElementById('b'+i);
  b.textContent=phrases[Math.floor(Math.random()*phrases.length)];
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),3000);
}
setInterval(showBubble,5000);
setTimeout(showBubble,1500);

// Stagger bob animation
document.querySelectorAll('.char').forEach((c,i)=>{
  c.style.animationDelay=(i*0.3)+'s';
});
</script>
