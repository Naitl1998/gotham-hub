<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Gotham3032 AI Office</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
--wall:#4a3728;--floor1:#d4b896;--floor2:#c9a882;--desk:#e8e8e8;--monitor:#222;
--sidebar:#1a1a2e;--sidebar2:#16213e;--accent:#00d4ff;--green:#00ff88;
}
body{font-family:'Press Start 2P',monospace;background:#0a0a1a;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column;image-rendering:pixelated}
#app{display:flex;flex:1;overflow:hidden}
#office-wrap{flex:1;min-width:0;position:relative;overflow:hidden;background:#2a1f14}
#office{width:100%;height:100%;position:relative}
#sidebar{width:280px;min-width:280px;background:var(--sidebar);display:flex;flex-direction:column;border-left:3px solid #0f3460;overflow-y:auto}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:#0f3460}
#statusbar{height:32px;min-height:32px;background:#0f0f23;display:flex;align-items:center;justify-content:center;font-size:8px;color:#888;border-top:2px solid #1a1a3e;gap:16px}
.sb-header{padding:12px;text-align:center;border-bottom:2px solid #0f3460}
.sb-title{font-size:9px;color:var(--accent);margin-bottom:8px}
.sb-stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sb-stat{background:#0f3460;padding:4px 8px;font-size:7px;color:#aaa}
.sb-btc{padding:8px 12px;text-align:center;font-size:8px;color:#f7931a;border-bottom:2px solid #0f3460;background:#0d1b2a}
.agent-list{flex:1;padding:8px}
.agent-card{display:flex;gap:8px;padding:8px;margin-bottom:6px;background:#0d1b2a;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.agent-card:hover,.agent-card.active{border-color:var(--accent)}
.agent-avatar{width:32px;height:32px;min-width:32px;position:relative}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:8px;color:#fff;display:flex;align-items:center;gap:4px}
.agent-name .dot{width:6px;height:6px;background:var(--green);display:inline-block;animation:pulse-dot 2s infinite}
.agent-role{font-size:7px;color:#888;margin-top:2px}
.agent-task{font-size:6px;color:#555;margin-top:2px}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes flicker{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes glow-pulse{0%,100%{opacity:.3}50%{opacity:.6}}
@keyframes highlight-pulse{0%,100%{box-shadow:0 0 8px 2px var(--accent)}50%{box-shadow:0 0 16px 6px var(--accent)}}

/* Office Canvas */
.floor{position:absolute;inset:0;display:grid;grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(14,1fr)}
.tile{border:1px solid rgba(0,0,0,.05)}
.tile:nth-child(odd){background:var(--floor1)}
.tile:nth-child(even){background:var(--floor2)}
.wall{position:absolute;top:0;left:0;right:0;height:50px;background:var(--wall);border-bottom:4px solid #3a2a1a;z-index:2}
.wall-detail{position:absolute;display:flex;align-items:center;justify-content:center}

/* Wall elements */
.window{position:absolute;top:8px;width:50px;height:34px;background:#87ceeb;border:3px solid #5a4a3a;z-index:3}
.window::before,.window::after{content:'';position:absolute;top:0;width:10px;height:100%;background:#3366aa}
.window::before{left:-2px}
.window::after{right:-2px}
.window-cross{position:absolute;top:50%;left:0;right:0;height:2px;background:#5a4a3a;z-index:4}
.window-crossv{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#5a4a3a;z-index:4}
.bookshelf{position:absolute;top:6px;width:60px;height:38px;background:#5a3a1a;border:2px solid #3a2a0a;z-index:3;display:flex;flex-wrap:wrap;gap:1px;padding:2px;align-content:flex-start}
.book{width:5px;height:16px}
.poster{position:absolute;top:10px;width:24px;height:30px;border:2px solid #8a7a5a;z-index:3}

/* Furniture */
.desk{position:absolute;width:56px;height:36px;background:var(--desk);border:2px solid #ccc;z-index:5;cursor:pointer}
.desk .monitor{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:22px;height:12px;background:var(--monitor);border:1px solid #444;animation:flicker 3s infinite}
.desk .monitor-screen{position:absolute;top:1px;left:1px;right:1px;bottom:1px;background:#1a3a2a}
.character{position:absolute;z-index:6;cursor:pointer;animation:idle 3s ease-in-out infinite}
.char-head{width:16px;height:16px;border-radius:50%;position:relative;margin:0 auto}
.char-body{width:12px;height:8px;margin:0 auto;margin-top:-1px}
.char-hat{position:absolute;top:-3px;left:50%;transform:translateX(-50%);height:5px}
.nametag{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:6px;color:#fff;background:rgba(0,0,0,.7);padding:1px 3px;margin-top:2px;z-index:7}
.team-label{position:absolute;font-size:8px;color:#fff;background:rgba(0,0,0,.6);padding:3px 8px;z-index:10;white-space:nowrap}

/* Furniture items */
.plant{position:absolute;width:16px;height:16px;z-index:4}
.plant-pot{width:12px;height:8px;background:#8b4513;margin:0 auto;margin-top:8px}
.plant-top{width:16px;height:12px;background:#228b22;border-radius:50%;margin:0 auto}
.lamp{position:absolute;width:14px;height:14px;z-index:4}
.lamp-base{width:14px;height:14px;background:#daa520;border-radius:50%;position:relative}
.lamp-glow{position:absolute;inset:-8px;background:radial-gradient(circle,rgba(255,220,100,.3),transparent);border-radius:50%;animation:glow-pulse 4s infinite}
.water-cooler{position:absolute;width:14px;height:20px;background:#b0c4de;border:2px solid #888;z-index:4}
.water-cooler::before{content:'';position:absolute;top:-4px;left:2px;width:8px;height:6px;background:#4a90d9;border:1px solid #3a70a9}
.sofa{position:absolute;width:50px;height:22px;background:#8b4555;border:2px solid #6a3040;z-index:4}
.coffee-table{position:absolute;width:28px;height:16px;background:#6a4a2a;border:2px solid #4a3a1a;z-index:4}
.whiteboard{position:absolute;width:70px;height:40px;background:#f0f0f0;border:3px solid #888;z-index:3}
.wb-text{font-size:6px;color:#333;padding:3px;text-align:center}
.wb-btc{font-size:7px;color:#f7931a;font-weight:bold}

/* Popup */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.popup-overlay.show{display:flex}
.popup{background:#1a1a2e;border:3px solid var(--accent);padding:16px;min-width:220px;max-width:280px}
.popup-close{float:right;cursor:pointer;color:var(--accent);font-size:10px}
.popup h3{font-size:10px;color:var(--accent);margin-bottom:8px}
.popup p{font-size:7px;color:#aaa;margin-bottom:4px}
.popup .stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #0f3460}
.popup .stat-val{color:var(--green)}

.desk.highlighted{animation:highlight-pulse 1s infinite}

@media(max-width:700px){
  #app{flex-direction:column}
  #sidebar{width:100%;min-width:0;max-height:40vh;border-left:none;border-top:3px solid #0f3460}
  #office-wrap{min-height:55vh}
}
</style>
</head>
<body>
<div id="app">
<div id="office-wrap">
<div id="office">
<!-- Floor tiles -->
<div class="floor" id="floor"></div>
<!-- Wall -->
<div class="wall">
  <div class="window" style="left:20px"><div class="window-cross"></div><div class="window-crossv"></div></div>
  <div class="bookshelf" style="left:90px">
    <div class="book" style="background:#c0392b"></div><div class="book" style="background:#2980b9"></div>
    <div class="book" style="background:#27ae60"></div><div class="book" style="background:#f39c12"></div>
    <div class="book" style="background:#8e44ad"></div><div class="book" style="background:#e74c3c"></div>
    <div class="book" style="background:#3498db"></div><div class="book" style="background:#2ecc71"></div>
    <div class="book" style="background:#e67e22"></div><div class="book" style="background:#9b59b6"></div>
  </div>
  <div class="poster" style="left:170px;background:#2c3e50"><div style="width:8px;height:8px;background:#e74c3c;margin:6px auto"></div></div>
  <div class="poster" style="left:210px;background:#1a5276"><div style="width:12px;height:4px;background:#f7dc6f;margin:8px auto"></div></div>
  <div class="bookshelf" style="right:120px">
    <div class="book" style="background:#e74c3c"></div><div class="book" style="background:#1abc9c"></div>
    <div class="book" style="background:#f1c40f"></div><div class="book" style="background:#3498db"></div>
    <div class="book" style="background:#e67e22"></div><div class="book" style="background:#2ecc71"></div>
  </div>
  <div class="window" style="right:20px"><div class="window-cross"></div><div class="window-crossv"></div></div>
  <div class="poster" style="right:85px;background:#1c2833;width:30px"><div style="font-size:5px;color:#f7931a;text-align:center;padding-top:10px">₿</div></div>
</div>

<!-- Whiteboard on wall -->
<div class="whiteboard" style="top:54px;left:50%;transform:translateX(-50%)">
  <div class="wb-text">📊 BTC Price</div>
  <div class="wb-btc" id="wb-btc">Loading...</div>
  <div class="wb-text" style="font-size:5px;color:#888">Live</div>
</div>

<!-- Team Labels -->
<div class="team-label" style="top:70px;left:16px">✅ Crypto Start Team</div>
<div class="team-label" style="top:200px;left:16px">🔧 Trading Team</div>

<!-- Crypto Start Team desks (4) -->
<div class="desk" id="desk-0" style="top:95px;left:20px" onclick="showPopup(0)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-0" style="top:108px;left:38px" onclick="showPopup(0)">
  <div class="char-head" style="background:#f5c6a0"><div class="char-hat" style="width:14px;background:#6a5acd;top:-5px;height:7px"></div></div>
  <div class="char-body" style="background:#4a4aaa"></div>
  <div class="nametag">Альф</div>
</div>

<div class="desk" id="desk-1" style="top:95px;left:100px" onclick="showPopup(1)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-1" style="top:108px;left:118px" onclick="showPopup(1)">
  <div class="char-head" style="background:#f5c6a0"><div class="char-hat" style="width:16px;background:#cc2233;border-radius:50% 50% 0 0;top:-4px;height:6px"></div></div>
  <div class="char-body" style="background:#cc4444"></div>
  <div class="nametag">Нова</div>
</div>

<div class="desk" id="desk-2" style="top:95px;left:180px" onclick="showPopup(2)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-2" style="top:108px;left:198px" onclick="showPopup(2)">
  <div class="char-head" style="background:#f5c6a0"><div class="char-hat" style="width:18px;background:#222;border-radius:50% 50% 30% 30%;top:-5px;height:9px"></div></div>
  <div class="char-body" style="background:#333"></div>
  <div class="nametag">Сатоши</div>
</div>

<div class="desk" id="desk-3" style="top:95px;left:260px" onclick="showPopup(3)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-3" style="top:108px;left:278px" onclick="showPopup(3)">
  <div class="char-head" style="background:#f5c6a0"><div class="char-hat" style="width:12px;background:#8b00ff;clip-path:polygon(50% 0%,0% 100%,100% 100%);top:-7px;height:9px"></div></div>
  <div class="char-body" style="background:#6a2c91"></div>
  <div class="nametag">Оракл</div>
</div>

<!-- Trading Team desks (3) -->
<div class="desk" id="desk-4" style="top:225px;left:50px" onclick="showPopup(4)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-4" style="top:238px;left:68px" onclick="showPopup(4)">
  <div class="char-head" style="background:#f5c6a0"><div class="char-hat" style="width:14px;background:#ff69b4;top:-4px;height:6px"></div><div style="position:absolute;top:0;right:-4px;width:3px;height:10px;background:#ff69b4"></div></div>
  <div class="char-body" style="background:#e75480"></div>
  <div class="nametag">Рита</div>
</div>

<div class="desk" id="desk-5" style="top:225px;left:160px" onclick="showPopup(5)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-5" style="top:238px;left:178px" onclick="showPopup(5)">
  <div class="char-head" style="background:#f5c6a0"><div class="char-hat" style="width:14px;background:#2e8b57;top:-5px;height:7px"></div></div>
  <div class="char-body" style="background:#3a6b4a"></div>
  <div class="nametag">Хедж</div>
</div>

<div class="desk" id="desk-6" style="top:225px;left:270px" onclick="showPopup(6)">
  <div class="monitor"><div class="monitor-screen"></div></div>
</div>
<div class="character" id="char-6" style="top:238px;left:288px" onclick="showPopup(6)">
  <div class="char-head" style="background:#c0c0c0;border-radius:2px !important;width:14px;height:14px"><div style="position:absolute;top:-5px;left:50%;width:2px;height:5px;background:#888;transform:translateX(-50%)"></div><div style="position:absolute;top:-7px;left:50%;width:4px;height:4px;background:#ff4444;border-radius:50%;transform:translateX(-50%)"></div></div>
  <div class="char-body" style="background:#999;width:10px"></div>
  <div class="nametag">Бот-9000</div>
</div>

<!-- Furniture -->
<div class="plant" style="top:60px;left:340px"><div class="plant-top"></div><div class="plant-pot"></div></div>
<div class="plant" style="top:170px;left:10px"><div class="plant-top"></div><div class="plant-pot"></div></div>
<div class="plant" style="top:285px;left:340px"><div class="plant-top"></div><div class="plant-pot"></div></div>

<div class="lamp" style="top:170px;left:340px"><div class="lamp-base"></div><div class="lamp-glow"></div></div>
<div class="lamp" style="top:290px;left:20px"><div class="lamp-base"></div><div class="lamp-glow"></div></div>

<div class="water-cooler" style="top:170px;left:300px"></div>

<div class="sofa" style="top:290px;left:200px"></div>
<div class="coffee-table" style="top:295px;left:258px"></div>

</div>
</div>

<div id="sidebar">
  <div class="sb-header">
    <div class="sb-title">⚡ GOTHAM3032 AI OFFICE</div>
    <div class="sb-stats">
      <div class="sb-stat">Агентов: 7</div>
      <div class="sb-stat">Активных: 7</div>
      <div class="sb-stat">Расход/день: --</div>
    </div>
  </div>
  <div class="sb-btc">₿ BTC: <span id="btc-price">...</span></div>
  <div class="agent-list" id="agent-list"></div>
</div>
</div>

<div id="statusbar">
  <span>Gotham3032 AI Office</span>
  <span>|</span>
  <span>Агентов: 7</span>
  <span>|</span>
  <span>Активных: 7</span>
  <span>|</span>
  <span id="clock">--:--:--</span>
</div>

<div class="popup-overlay" id="popup-overlay" onclick="closePopup(event)">
  <div class="popup" id="popup"></div>
</div>

<script>
const agents=[
{name:'Альф',role:'Теханалитик',task:'Анализирует BTC графики',strategy:'Теханализ + индикаторы',hat:'#6a5acd',body:'#4a4aaa'},
{name:'Нова',role:'Новостной аналитик',task:'Мониторит новости',strategy:'Новостной скрининг',hat:'#cc2233',body:'#cc4444'},
{name:'Сатоши',role:'On-chain аналитик',task:'Читает блокчейн',strategy:'On-chain метрики',hat:'#222',body:'#333'},
{name:'Оракл',role:'Сентимент-аналитик',task:'Чувствует рынок',strategy:'Анализ настроений',hat:'#8b00ff',body:'#6a2c91'},
{name:'Рита',role:'Агрессивный трейдер',task:'Ставит по-крупному',strategy:'Высокий риск / профит',hat:'#ff69b4',body:'#e75480'},
{name:'Хедж',role:'Консервативный трейдер',task:'Считает риски',strategy:'Хеджирование + стопы',hat:'#2e8b57',body:'#3a6b4a'},
{name:'Бот-9000',role:'Алго-трейдер',task:'Выполняет алгоритм',strategy:'Алгоритмическая торговля',hat:'#c0c0c0',body:'#999'}
];

// Build sidebar agent cards
const listEl=document.getElementById('agent-list');
agents.forEach((a,i)=>{
const card=document.createElement('div');
card.className='agent-card';
card.id='card-'+i;
card.onclick=()=>highlightAgent(i);
card.innerHTML=`
<div class="agent-avatar">
  <svg width="32" height="32" viewBox="0 0 32 32">
    <rect x="9" y="14" width="14" height="10" fill="${a.body}" />
    <circle cx="16" cy="12" r="7" fill="#f5c6a0"/>
    <rect x="9" y="3" width="14" height="6" fill="${a.hat}"/>
    ${i===6?'<rect x="15" y="0" width="2" height="4" fill="#888"/><circle cx="16" cy="0" r="2" fill="#f44"/>':''}
  </svg>
</div>
<div class="agent-info">
  <div class="agent-name">${a.name} <span class="dot"></span></div>
  <div class="agent-role">${a.role}</div>
  <div class="agent-task">${a.task}</div>
</div>`;
listEl.appendChild(card);
});

// Highlight agent on floor
let activeCard=-1;
function highlightAgent(i){
  document.querySelectorAll('.desk').forEach(d=>d.classList.remove('highlighted'));
  document.querySelectorAll('.agent-card').forEach(c=>c.classList.remove('active'));
  if(activeCard===i){activeCard=-1;return;}
  activeCard=i;
  document.getElementById('desk-'+i).classList.add('highlighted');
  document.getElementById('card-'+i).classList.add('active');
  document.getElementById('desk-'+i).scrollIntoView({behavior:'smooth',block:'center'});
}

// Popup
function showPopup(i){
  const a=agents[i];
  const p=document.getElementById('popup');
  p.innerHTML=`
    <span class="popup-close" onclick="closePopup(event,true)">✕</span>
    <h3>${a.name}</h3>
    <p>${a.role}</p>
    <div style="margin-top:8px">
      <div class="stat-row"><span>Стратегия</span><span class="stat-val">${a.strategy}</span></div>
      <div class="stat-row"><span>Баланс</span><span class="stat-val">$10,000</span></div>
      <div class="stat-row"><span>Сделок</span><span class="stat-val">0</span></div>
      <div class="stat-row"><span>Win Rate</span><span class="stat-val">--%</span></div>
      <div class="stat-row"><span>Статус</span><span class="stat-val" style="color:var(--green)">🟢 Активен</span></div>
    </div>`;
  document.getElementById('popup-overlay').classList.add('show');
}
function closePopup(e,force){
  if(force||e.target.id==='popup-overlay')document.getElementById('popup-overlay').classList.remove('show');
}

// Clock
function updateClock(){
  const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleTimeString('ru-RU');
}
setInterval(updateClock,1000);updateClock();

// BTC price
async function fetchBTC(){
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const d=await r.json();
    const p=parseFloat(d.price).toLocaleString('en-US',{maximumFractionDigits:0});
    document.getElementById('btc-price').textContent='$'+p;
    document.getElementById('wb-btc').textContent='$'+p;
  }catch(e){
    document.getElementById('btc-price').textContent='N/A';
    document.getElementById('wb-btc').textContent='N/A';
  }
}
fetchBTC();setInterval(fetchBTC,15000);

// Floor tiles
const floor=document.getElementById('floor');
for(let i=0;i<280;i++){const t=document.createElement('div');t.className='tile';floor.appendChild(t);}

// Vary idle animations
document.querySelectorAll('.character').forEach((c,i)=>{
  c.style.animationDelay=(i*0.4)+'s';
  c.style.animationDuration=(2.5+i*0.3)+'s';
});

// Telegram WebApp
try{
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.BackButton.show();
  Telegram.WebApp.BackButton.onClick(()=>window.location.href='index.html');
}catch(e){}
</script>
</body>
</html>
